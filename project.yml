name: WhatsAppPrivacy
options:
  bundleIdPrefix: com.wablur
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # RESOLVED (was a KNOWN LIMITATION): ad-hoc ("-") signing changes the
    # binary's signature on every rebuild, and TCC's Accessibility grant got
    # keyed to that changing signature -- System Settings showed the toggle
    # on while the actual running process was silently denied. Confirmed
    # live during development. A real Apple Development certificate was
    # tried next, but automatic/manual signing with it failed under
    # `xcodebuild` CLI builds ("no certificate ... found") because the
    # associated Apple ID isn't added to this machine's Xcode Accounts, so
    # Xcode can't resolve a matching provisioning profile non-interactively
    # -- codesign itself could use the certificate fine, only Xcode's
    # provisioning resolution couldn't. The fix: a locally-generated,
    # self-signed code-signing certificate ("WhatsAppPrivacy Local Dev"),
    # imported into the login keychain and trusted for the codeSign policy.
    # It has no Team ID and needs no provisioning profile (this app has zero
    # entitlements/capabilities that would require one), and unlike ad-hoc
    # signing, the certificate's identity is fixed -- rebuilding the binary
    # never changes it, so the TCC grant now survives rebuilds. Setup (not
    # needed again on this machine, but needed on a fresh machine/keychain):
    #   openssl req -x509 -newkey rsa:2048 -keyout key.pem -out cert.pem \
    #     -days 3650 -nodes -subj "/CN=WhatsAppPrivacy Local Dev" \
    #     -addext "keyUsage=critical,digitalSignature" \
    #     -addext "extendedKeyUsage=critical,codeSigning"
    #   openssl pkcs12 -export -out cert.p12 -inkey key.pem -in cert.pem \
    #     -passout pass:temp -legacy   # -legacy: security's PKCS12 parser
    #     # needs the older encryption OpenSSL 3.x no longer defaults to.
    #   security import cert.p12 -k ~/Library/Keychains/login.keychain-db \
    #     -P temp -T /usr/bin/codesign -A
    #   security add-trusted-cert -p codeSign \
    #     -k ~/Library/Keychains/login.keychain-db cert.pem
    CODE_SIGN_IDENTITY: "WhatsAppPrivacy Local Dev"
    CODE_SIGN_STYLE: Manual
targets:
  WhatsAppPrivacy:
    type: application
    platform: macOS
    sources:
      - path: WhatsAppPrivacy
    info:
      path: WhatsAppPrivacy/Info.plist
      properties:
        CFBundleName: WhatsApp Privacy
        CFBundleDisplayName: WhatsApp Privacy
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wablur.WhatsAppPrivacy
  WhatsAppPrivacyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: WhatsAppPrivacyTests
    dependencies:
      - target: WhatsAppPrivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wablur.WhatsAppPrivacyTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  WhatsAppPrivacy:
    build:
      targets:
        WhatsAppPrivacy: all
        WhatsAppPrivacyTests: [test]
    test:
      targets:
        - WhatsAppPrivacyTests
    run:
      config: Debug
