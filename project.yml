name: WhatsAppPrivacy
options:
  bundleIdPrefix: com.wablur
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # KNOWN LIMITATION (see design spec / acceptance results): ad-hoc ("-")
    # signing means every rebuild changes the binary's signature, and TCC's
    # Accessibility grant can get keyed to that changing signature -- System
    # Settings shows the toggle on while the actual running process is
    # silently denied. Confirmed live during Phase 1 development, and a
    # `codesign identity: Apple Development` switch was attempted but hit
    # keychain identity-matching failures under `xcodebuild` CLI builds that
    # weren't worth blocking on. Workaround for now: after every rebuild,
    # run `tccutil reset Accessibility com.wablur.WhatsAppPrivacy` and
    # re-grant. A real end user building once (not rebuilding every few
    # minutes during active development) shouldn't hit this at all -- it's
    # specific to this dev loop, not the shipped behavior.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
targets:
  WhatsAppPrivacy:
    type: application
    platform: macOS
    sources:
      - path: WhatsAppPrivacy
    info:
      path: WhatsAppPrivacy/Info.plist
      properties:
        CFBundleName: WhatsApp Privacy
        CFBundleDisplayName: WhatsApp Privacy
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wablur.WhatsAppPrivacy
  WhatsAppPrivacyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: WhatsAppPrivacyTests
    dependencies:
      - target: WhatsAppPrivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wablur.WhatsAppPrivacyTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  WhatsAppPrivacy:
    build:
      targets:
        WhatsAppPrivacy: all
        WhatsAppPrivacyTests: [test]
    test:
      targets:
        - WhatsAppPrivacyTests
    run:
      config: Debug
